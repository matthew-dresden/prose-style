name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prose:
    name: lint, spell, and self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install pymarkdownlnt codespell

      - name: Markdown lint
        run: |
          pymarkdown --config .pymarkdown.json scan $(git ls-files '*.md')

      - name: US English spell check
        run: |
          codespell --check-filenames --ignore-words-list=nd,te,intype $(git ls-files '*.md')

      - name: Prose dashes and frontmatter
        run: python scripts/check_prose.py
