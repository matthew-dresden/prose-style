name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate PR title (conventional commits)
        run: python3 -m scripts.validate_pr_title --title '${{ github.event.pull_request.title }}'

  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters and test runner
        run: |
          python -m pip install --upgrade pip
          pip install pymarkdownlnt codespell pytest

      - name: Markdown lint
        run: |
          pymarkdown --config .pymarkdown.json scan $(git ls-files '*.md')

      - name: US English spell check
        run: |
          codespell --check-filenames --ignore-words-list=nd,te,intype $(git ls-files '*.md')

      - name: Prose dashes and frontmatter
        run: python scripts/check_prose.py

      - name: Release script unit tests
        run: pytest tests -q

      - name: Version immutability
        if: github.event.pull_request.user.login != 'matthew-dresden-cicd[bot]'
        run: python3 -m scripts.check_version_immutability --base-ref origin/main
