name: Tag Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Check for release commit
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: python3 -m scripts.check_release_commit --commit-message "${COMMIT_MSG}" --output "${GITHUB_OUTPUT}"

      - name: Create tag
        id: tag
        if: steps.check.outputs.should_skip == 'true'
        env:
          RELEASE_VERSION: ${{ steps.check.outputs.release_version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          FULL_TAG="v${RELEASE_VERSION}"
          if git rev-parse -q --verify "refs/tags/${FULL_TAG}" >/dev/null; then
            echo "::notice::Tag ${FULL_TAG} already exists, skipping"
            echo "created=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git tag -a "${FULL_TAG}" -m "Release ${FULL_TAG}"
          git push origin "${FULL_TAG}"
          echo "created=true" >> "${GITHUB_OUTPUT}"
          echo "full_tag=${FULL_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FULL_TAG: ${{ steps.tag.outputs.full_tag }}
        run: |
          awk -v header="## [${FULL_TAG}]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          gh release create "${FULL_TAG}" \
            --repo '${{ github.repository }}' \
            --title "${FULL_TAG}" \
            --notes-file release-notes.md \
            --target main
