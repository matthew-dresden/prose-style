name: Main Validation

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: false

env:
  GIT_USER: "matthew-dresden-cicd[bot]"
  GIT_USER_EMAIL: "matthew-dresden-cicd[bot]@users.noreply.github.com"

jobs:
  skip-check:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
      release_version: ${{ steps.check.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for release commit
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: python3 -m scripts.check_release_commit --commit-message "${COMMIT_MSG}" --output "${GITHUB_OUTPUT}"

  validate:
    needs: [skip-check]
    if: needs.skip-check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters and test runner
        run: |
          python -m pip install --upgrade pip
          pip install pymarkdownlnt codespell pytest

      - name: Markdown lint
        run: |
          pymarkdown --config .pymarkdown.json scan $(git ls-files '*.md')

      - name: US English spell check
        run: |
          codespell --check-filenames --ignore-words-list=nd,te,intype $(git ls-files '*.md')

      - name: Prose dashes and frontmatter
        run: python scripts/check_prose.py

      - name: Release script unit tests
        run: pytest tests -q

  release-pr:
    needs: [skip-check, validate]
    if: needs.skip-check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch latest main and tags
        run: git fetch origin main --tags

      - name: Configure git
        run: |
          git config user.name "${GIT_USER}"
          git config user.email "${GIT_USER_EMAIL}"

      - name: Calculate version
        id: calc
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: python3 -m scripts.ci_calculate_version --commit-message "${COMMIT_MSG}" --output "${GITHUB_OUTPUT}"

      - name: Create release branch
        env:
          FULL_TAG: ${{ steps.calc.outputs.full_tag }}
        run: |
          git reset --hard origin/main
          git checkout -b "release/${FULL_TAG}"

      - name: Update version files
        env:
          NEXT_VERSION: ${{ steps.calc.outputs.next_version }}
        run: python3 -m scripts.update_version_files --version "${NEXT_VERSION}"

      - name: Generate changelog
        env:
          NEXT_VERSION: ${{ steps.calc.outputs.next_version }}
        run: python3 -m scripts.ci_generate_changelog --version "${NEXT_VERSION}"

      - name: Commit release changes
        env:
          FULL_TAG: ${{ steps.calc.outputs.full_tag }}
        run: |
          git add -A
          git commit -m "chore(release): ${FULL_TAG}"
          git push origin "release/${FULL_TAG}"

      - name: Open release PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FULL_TAG: ${{ steps.calc.outputs.full_tag }}
          NEXT_VERSION: ${{ steps.calc.outputs.next_version }}
        run: >-
          gh pr create
          --repo '${{ github.repository }}'
          --base main
          --head "release/${FULL_TAG}"
          --title "chore(release): ${FULL_TAG}"
          --body "Automated release PR. Bumps version files to ${NEXT_VERSION} and updates the changelog. Merging creates tag ${FULL_TAG} and the GitHub Release."
