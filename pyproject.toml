[project]
name = "prose-style"
version = "0.2.0"
description = "Prose and document standard for the AI era, derived from pre-LLM US English."
requires-python = ">=3.11"
license = "Apache-2.0"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
